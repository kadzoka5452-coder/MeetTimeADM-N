<!DOCTYPE html>
<html lang="tr"> 
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>MeetTime Yönetim</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,Arial,sans-serif;background:#f6f6f8;color:#171717;min-height:100vh}
button,input{font:inherit}
.login{min-height:100vh;display:grid;place-items:center;padding:20px}
.login-box,.panel{background:#fff;border:1px solid #e6e6e6;border-radius:22px;box-shadow:0 20px 60px #0000000d}
.login-box{width:min(390px,100%);padding:34px}
.logo{font-size:28px;font-weight:900;background:linear-gradient(45deg,#f58529,#dd2a7b,#8134af);-webkit-background-clip:text;color:transparent}
.muted{color:#777;font-size:14px;margin:8px 0 24px}
label{display:block;font-size:12px;font-weight:800;margin:0 0 7px}
input{width:100%;padding:13px;border:1px solid #ddd;border-radius:10px;outline:0}
input:focus{border-color:#dd2a7b;box-shadow:0 0 0 3px #dd2a7b12}
.btn{border:0;border-radius:10px;padding:13px 16px;cursor:pointer;font-weight:800}
.primary{width:100%;color:#fff;background:linear-gradient(45deg,#f58529,#dd2a7b,#8134af);margin-top:14px}
.error{color:#c51f61;font-size:13px;margin-top:10px;display:none}
.dashboard{display:none} 
header{background:#fff;border-bottom:1px solid #e7e7e7;padding:18px 5%;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:5}
header h1{font-size:23px}
.logout{background:#171717;color:#fff}
main{max-width:1250px;margin:auto;padding:35px 20px}
.top{display:flex;justify-content:space-between;gap:15px;align-items:end;margin-bottom:22px}
.top h2{font-size:30px}
.actions{display:flex;gap:10px}
.refresh{background:#fff;border:1px solid #ddd}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:20px}
.stat{background:#fff;border:1px solid #e7e7e7;border-radius:16px;padding:20px}
.stat span{color:#777;font-size:12px}.stat b{display:block;font-size:28px;margin-top:5px}
.table-wrap{overflow:auto;background:#fff;border:1px solid #e7e7e7;border-radius:18px}
table{width:100%;border-collapse:collapse;min-width:900px}
th,td{text-align:left;padding:15px;border-bottom:1px solid #eee;font-size:13px;vertical-align:top}
th{font-size:11px;text-transform:uppercase;letter-spacing:.7px;color:#777;background:#fafafa}
.reason{max-width:260px;color:#555}
.empty{text-align:center;padding:50px;color:#777}
.status{display:inline-block;padding:5px 9px;border-radius:999px;background:#fff3f8;color:#c32670;font-size:11px;font-weight:800}
.notice{margin:0 0 15px;padding:12px 14px;border-radius:10px;background:#fff8e8;color:#795500;font-size:13px;display:none}
@media(max-width:700px){.stats{grid-template-columns:1fr}.top{align-items:stretch;flex-direction:column}.actions{width:100%}.actions button{flex:1}}
</style>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0%25' stop-color='%23f58529'/%3E%3Cstop offset='45%25' stop-color='%23dd2a7b'/%3E%3Cstop offset='100%25' stop-color='%238134af'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='100' height='100' rx='28' fill='url(%23g)'/%3E%3Crect x='23' y='23' width='54' height='54' rx='17' fill='none' stroke='white' stroke-width='7'/%3E%3Ccircle cx='50' cy='50' r='13' fill='none' stroke='white' stroke-width='7'/%3E%3Ccircle cx='68' cy='32' r='5' fill='white'/%3E%3C/svg%3E">
</head>
<body>

<section class="login" id="login">
  <div class="login-box">
    <div class="logo">MeetTime</div>
    <h2 style="margin-top:8px">Yönetim Paneli</h2>
    <p class="muted">Başvuruları görüntülemek için yönetici şifresini gir.</p>
    <label for="password">Yönetici şifresi</label>
    <input id="password" type="password" placeholder="Şifre">
    <button class="btn primary" id="loginBtn">Panele Gir</button>
    <div class="error" id="loginError">Şifre yanlış.</div>
  </div>
</section>

<section class="dashboard" id="dashboard">
<header>
  <h1>MeetTime <span style="color:#dd2a7b">Yönetim</span></h1>
  <button class="btn logout" id="logout">Çıkış</button>
</header>
<main>
  <div class="top">
    <div><h2>Başvurular</h2><p class="muted" style="margin:4px 0 0">MeetTime başvuruları</p></div>
    <div class="actions"><button class="btn refresh" id="refresh">↻ Yenile</button></div>
  </div>

  <div class="notice" id="notice"></div>

  <div class="stats">
    <div class="stat"><span>Toplam başvuru</span><b id="total">0</b></div>
    <div class="stat"><span>Bugünkü başvuru</span><b id="today">0</b></div>
    <div class="stat"><span>Son başvuru</span><b id="latest">—</b></div>
  </div>

  <div class="table-wrap">
    <table>
      <thead><tr>
        <th>Sıra</th><th>Ad Soyad</th><th>Gün</th><th>Saat</th>
        <th>Buluşma nedeni</th><th>İletişim</th><th>Tarih</th><th>Durum</th>
      </tr></thead>
      <tbody id="rows"><tr><td colspan="8" class="empty">Başvurular yükleniyor...</td></tr></tbody>
    </table>
  </div>
</main>
</section>

<script>
/*
  1) Bu şifre SADECE basit bir ön ekran içindir.
  2) Gerçek güvenlik için şifreyi Worker tarafında doğrulamak gerekir.
  3) API adresi kendi Worker adresindir.
*/
const ADMIN_PASSWORD = "sex";
const API_URL = "https://meetime-api.kadzoka5452.workers.dev";

const login = document.getElementById("login");
const dashboard = document.getElementById("dashboard");
const password = document.getElementById("password");
const loginBtn = document.getElementById("loginBtn");
const loginError = document.getElementById("loginError");
const rows = document.getElementById("rows");
const notice = document.getElementById("notice");

function showDashboard(){
  login.style.display="none";
  dashboard.style.display="block";
  loadApplications();
}
function showError(msg){
  loginError.textContent=msg;
  loginError.style.display="block";
}
loginBtn.onclick=()=>{
  if(password.value===ADMIN_PASSWORD){
    sessionStorage.setItem("meet_admin","1");
    showDashboard();
  }else showError("Şifre yanlış.");
};
password.addEventListener("keydown",e=>{if(e.key==="Enter")loginBtn.click()});
document.getElementById("logout").onclick=()=>{
  sessionStorage.removeItem("meet_admin");
  location.reload();
};
document.getElementById("refresh").onclick=loadApplications;

async function loadApplications(){
  notice.style.display="none";
  rows.innerHTML='<tr><td colspan="8" class="empty">Başvurular yükleniyor...</td></tr>';
  try{
    const response=await fetch(API_URL+"?action=applications");
    const data=await response.json();

    if(!data.success) throw new Error(data.message||"Başvurular alınamadı.");

    const apps=data.applications||[];
    document.getElementById("total").textContent=apps.length;

    const todayKey=new Date().toLocaleDateString("tr-TR");
    const todayApps=apps.filter(a=>{
      const d=new Date(Number(a.created_at));
      return d.toLocaleDateString("tr-TR")===todayKey;
    });
    document.getElementById("today").textContent=todayApps.length;

    document.getElementById("latest").textContent=apps.length
      ? new Date(Number(apps[0].created_at)).toLocaleTimeString("tr-TR",{hour:"2-digit",minute:"2-digit"})
      : "—";

    if(!apps.length){
      rows.innerHTML='<tr><td colspan="8" class="empty">Henüz başvuru yok.</td></tr>';
      return;
    }

    rows.innerHTML=apps.map((a,i)=>`
      <tr>
        <td><strong>${escapeHtml(String(a.id ?? i+1).padStart(3,"0"))}</strong></td>
        <td><strong>${escapeHtml(a.name)}</strong></td>
        <td>${escapeHtml(a.day)}</td>
        <td>${escapeHtml(a.time)}</td>
        <td class="reason">${escapeHtml(a.reason)}</td>
        <td>${escapeHtml(a.contact)}</td>
        <td>${formatDate(a.created_at)}</td>
        <td><span class="status">İnceleniyor</span></td>
      </tr>
    `).join("");
  }catch(err){
    rows.innerHTML='<tr><td colspan="8" class="empty">Başvurular alınamadı.</td></tr>';
    notice.textContent=err.message+" Worker tarafında yönetim API'sini de açmamız gerekiyor.";
    notice.style.display="block";
  }
}
function formatDate(v){
  const d=new Date(Number(v));
  return isNaN(d)?"—":d.toLocaleString("tr-TR",{dateStyle:"short",timeStyle:"short"});
}
function escapeHtml(v){
  return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
}

if(sessionStorage.getItem("meet_admin")==="1") showDashboard();
</script>
</body>
</html>
